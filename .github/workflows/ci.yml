name: FinBridge - Maven CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: finbridge-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Require Docker for PostgreSQL integration tests
        run: docker info --format '{{.ServerVersion}}'
      - name: Unit, MVC, PostgreSQL and concurrency tests
        run: mvn -B --no-transfer-progress clean verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: finbridge-test-reports
          path: target/surefire-reports/TEST-*.xml
          if-no-files-found: warn
          retention-days: 7
