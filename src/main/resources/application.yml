spring:
  application:
    name: finbridge-banking
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:finbridge}
    username: ${DB_USER:finbridge}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}
  address: ${SERVER_ADDRESS:127.0.0.1}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

# Ruta administrativa deshabilitada salvo opt-in explícito de sandbox.
finbridge:
  sandbox:
    funding-enabled: ${SANDBOX_FUNDING_ENABLED:false}
  security:
    issuer: ${JWT_ISSUER}
    jwk-set-uri: ${JWT_JWK_SET_URI}
    audience: ${JWT_AUDIENCE}

logging:
  structured:
    format:
      console: logstash
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: OFF
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: OFF

